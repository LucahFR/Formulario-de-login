<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="perfil-container">
            <h1>Perfil</h1>
            <p><strong>Nome:</strong> <span id="perfil-nome"></span></p>
            <p><strong>Sobrenome:</strong> <span id="perfil-sobrenome"></span></p>
            <p><strong>Endereço:</strong> <span id="perfil-endereço"></span></p>
            <p><strong>Data de nascimento:</strong> <span id="perfil-data"></span></p>
            <p><strong>Filhos:</strong> <span id="perfil-filhos"></span></p>
            <p><strong>Esporte favorito:</strong> <span id="perfil-esporte"></span></p>
            <p><strong>Jogos favoritos:</strong> <span id="perfil-jogos"></span></p>
            <div>
                <img id="perfil-imagem" src="#" alt="Foto de perfil" style="max-width: 120px; border-radius: 50%; display: none;">
            </div>
            <div class="grupo-botao">
                <button id="editar-perfil" class="botao-customizadov2">Editar informações</button>
                <a href="login.html" class="botao-customizadov2">Sair</a>
            </div>
        </div>
    </div>
</body>
</html>
